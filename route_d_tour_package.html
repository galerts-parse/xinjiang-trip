<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 新疆丝路自驾环线 - 专业行程单 (17 Days)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #334155; background-color: #f8fafc; margin: 0; padding: 0; }
    .header { background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1596484552834-6a58f850e0a1?auto=format&fit=crop&w=1600&q=80') center/cover; color: white; padding: 60px 20px; text-align: center; }
    .header h1 { margin: 0 0 10px 0; font-size: 2.5rem; }
    .header p { margin: 0; font-size: 1.2rem; opacity: 0.9; }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .summary-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 40px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
    .summary-item { text-align: center; }
    .summary-item i { font-size: 24px; color: #3b82f6; margin-bottom: 10px; }
    .summary-item strong { display: block; font-size: 1.2rem; color: #0f172a; }
    .day-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 30px; overflow: hidden; page-break-inside: avoid; }
    .day-header { background: #3b82f6; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .day-header h2 { margin: 0; font-size: 1.5rem; }
    .day-date { font-weight: bold; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; }
    .day-body { padding: 25px; }
    .info-bar { display: flex; gap: 20px; margin-bottom: 20px; color: #64748b; font-weight: 500; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
    .info-bar i { color: #3b82f6; }
    .section-title { font-size: 1.1rem; color: #0f172a; margin: 25px 0 10px 0; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
    .schedule-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 20px; border-radius: 8px; margin-top: 20px; }
    .schedule-box h3 { margin: 0 0 15px 0; color: #166534; font-size: 1.1rem; }
    .schedule-box ul { margin: 0; padding-left: 20px; }
    .schedule-box li { margin-bottom: 8px; }
    .sights-text, .food-text, .accom-text { line-height: 1.8; }
    .practical { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 15px; margin-top: 20px; border-radius: 4px; color: #92400e; }
    a { color: #3b82f6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media print {
      body { background: white; }
      .header { padding: 40px 0; background: white; color: black; border-bottom: 2px solid #000; }
      .container { padding: 20px 0; }
      .day-card { box-shadow: none; border: 1px solid #ccc; margin-bottom: 20px; }
      .day-header { background: #f1f5f9; color: #000; border-bottom: 1px solid #ccc; }
      .day-date { background: transparent; color: #666; border: 1px solid #ccc; }
      .schedule-box { background: white; border: 1px solid #ccc; }
      .practical { background: white; border: 1px dashed #ccc; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>D线：17天西北丝路与北疆大环线（西安-乌鲁木齐）</h1>
    <p>出行日期： 2026年6月12日 - 6月28日 | 总时长： 17天 | 总里程： 约5800公里</p>
  </div>
  
  <div class="container">
    <div class="summary-card">
      <h2 style="margin-top: 0; color: #0f172a; text-align: center; margin-bottom: 25px;">行程速览 (Tour Overview)</h2>
      <div class="summary-grid">
        <div class="summary-item">
          <i class="fa-solid fa-calendar-days"></i>
          <span>出发日期</span>
          <strong>2026年6月12日</strong>
        </div>
        <div class="summary-item">
          <i class="fa-solid fa-clock"></i>
          <span>行程天数</span>
          <strong>17天16晚</strong>
        </div>
        <div class="summary-item">
          <i class="fa-solid fa-car-side"></i>
          <span>自驾总里程</span>
          <strong>约 5,800 km</strong>
        </div>
        <div class="summary-item">
          <i class="fa-solid fa-map-location-dot"></i>
          <span>横跨省份</span>
          <strong>陕西、甘肃、新疆</strong>
        </div>
      </div>
    </div>

    <div id="itinerary-container">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- Dynamic Cache Busting Script Loader -->
  <script>
    const version = new Date().getTime();
    const script = document.createElement('script');
    script.src = 'data_route_d.js?v=' + version;
    script.async = false;
    document.body.appendChild(script);

    script.onload = () => {
      const container = document.getElementById('itinerary-container');
      
      if (typeof itineraryDataD === 'undefined') {
        container.innerHTML = '<p>Error loading itinerary data.</p>';
        return;
      }
      
      itineraryDataD.forEach(day => {
      const card = document.createElement('div');
      card.className = 'day-card';
      
      card.innerHTML = `
        <div class="day-header">
          <h2>Day ${day.day}: ${day.title}</h2>
          <span class="day-date">${day.date}</span>
        </div>
        <div class="day-body">
          <div class="info-bar">
            <span><i class="fa-solid fa-route"></i> 驾驶里程: ${day.distance}</span>
            <span><i class="fa-regular fa-clock"></i> 预计车程: ${day.time}</span>
          </div>
          
          <div class="schedule-box">
            <h3><i class="fa-regular fa-clock"></i> 今日详细时刻表 (Schedule)</h3>
            ${day.schedule || '<p>时刻表暂未提供</p>'}
          </div>

          <div class="section-title"><i class="fa-solid fa-camera-retro"></i> 景点与活动 (Sights & Activities)</div>
          <div class="sights-text">${day.sights}</div>

          <div class="section-title"><i class="fa-solid fa-utensils"></i> 餐饮安排 (Dining)</div>
          <div class="food-text">${day.food}</div>

          <div class="section-title"><i class="fa-solid fa-bed"></i> 住宿安排 (Accommodation)</div>
          <div class="accom-text">${day.accommodation}</div>

          <div class="practical">
            <strong><i class="fa-solid fa-triangle-exclamation"></i> 领队提示 (Guide Tips):</strong><br>
            ${day.practical}
          </div>
        </div>
      `;
      
      container.appendChild(card);
    });
    };
  </script>
</body>
</html>

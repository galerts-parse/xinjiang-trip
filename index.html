<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 新疆丝路自驾之旅 (Xinjiang Road Trip 2026)</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Xinjiang">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header" id="sidebar-handle">
      <div class="drag-handle"></div>
      <h1>新疆自驾探险 <br><span style="font-size: 16px; color: #94a3b8;">Xinjiang Road Trip</span></h1>
      <p style="margin-bottom: 10px;">2026年6月12日出发 (16-17 Days)</p>
      <select id="route-selector" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; background: white; outline: none;">
        <option value="routeX" selected>Route X: 绝美风光与深度人文之选 (17 Days)</option>
        <option value="routeD">Route D: 终极不留遗憾版 (17 Days)</option>
        <option value="routeE">Route E: 封神版备份 (Pre-Hotel Changes)</option>
        <option value="routeA">Route A: Silk Road Classic (with Dunhuang)</option>
        <option value="routeB">Route B: Northern Nature (17 Days)</option>
        <option value="routeC">Route C: Grand Tour (17 Days)</option>
      </select>
      <a id="tour-package-link" href="route_x_tour_package.html" target="_blank" style="display: block; margin-top: 15px; padding: 10px; text-align: center; background-color: #2563eb; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px;">
        <i class="fa-solid fa-file-pdf"></i> View Professional Tour Package
      </a>
      <a href="ticketing.html" target="_blank" style="display: block; margin-top: 10px; padding: 10px; text-align: center; background-color: #059669; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px;">
        <i class="fa-solid fa-ticket"></i> Ticketing & Cost Matrix
      </a>
      <a href="deep_dives.html" target="_blank" style="display: block; margin-top: 10px; padding: 10px; text-align: center; background-color: #f59e0b; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px;">
        <i class="fa-solid fa-book-open"></i> Attraction Deep Dives & Strategies
      </a>
    </div>
    <div id="itinerary-list">
      <!-- Generated dynamically by app.js -->
    </div>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Data & App Logic (Dynamic Cache Busting) -->
  <script>
    const version = new Date().getTime();
    const scripts = ['data.js', 'data_alt.js', 'data_route_c.js', 'data_route_d.js', 'data_route_e.js', 'data_route_x.js', 'app.js'];
    scripts.forEach(src => {
      const script = document.createElement('script');
      script.src = src + '?v=' + version;
      script.async = false; // Ensures scripts execute in order
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
